<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="choose_bootstrap_version.css" />
    <title>Choose Bootstrap Version</title>
  </head>
  <body>
    <form id="popup-content">
      <div class="field">
        <label for="from">Your site uses</label>
        <select id="from" name="from"></select>
        <small id="detected" class="hint hidden"></small>
      </div>
      <div class="field">
        <label for="to">Migrating to</label>
        <select id="to" name="to"></select>
      </div>
      <ul class="legend">
        <li><span class="swatch swatch-removed"></span>Removed in the target version</li>
        <li><span class="swatch swatch-deprecated"></span>Deprecated in the target version</li>
      </ul>
      <div class="actions">
        <button type="submit" id="highlight">Highlight</button>
        <button type="button" id="clear" disabled>Clear</button>
      </div>
      <p id="status" class="hint" role="status"></p>
    </form>
    <div id="error-content" class="hidden">
      <p>Can't run this extension on this web page.</p>
      <p>Try a different page.</p>
    </div>
    <script type="module" src="choose_bootstrap_version.js"></script>
  </body>
</html>
